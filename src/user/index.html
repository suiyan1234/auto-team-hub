<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Team Hub - 用户中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="../shared/css/main.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside id="sidebar" class="w-64 gradient-bg text-white flex flex-col shadow-2xl">
            <!-- Dynamic content inserted by sidebar.js -->
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-auto">
            <!-- Header -->
            <header id="header" class="glass-effect sticky top-0 z-40 px-8 py-4 shadow-sm flex justify-between items-center">
                <!-- Dynamic content inserted by header.js -->
            </header>

            <div class="p-8" id="main-container">
                <!-- Dashboard Section -->
                <section id="section-dashboard" class="space-y-6 slide-in">
                    <!-- Personal Stats Cards -->
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                        <div class="bg-white rounded-xl p-6 shadow-sm card-hover border-l-4 border-blue-500">
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="text-sm text-gray-500 mb-1">本月加班</p>
                                    <h3 class="text-2xl font-bold text-gray-800" id="user-month-ot">0h</h3>
                                    <p class="text-xs text-gray-500 mt-1">目标: 40h</p>
                                </div>
                                <div class="p-3 bg-blue-100 rounded-lg">
                                    <i class="fas fa-clock text-blue-600 text-xl"></i>
                                </div>
                            </div>
                            <div class="mt-3 w-full bg-gray-200 rounded-full h-2">
                                <div class="bg-blue-600 h-2 rounded-full progress-bar" id="user-ot-progress" style="width: 0%"></div>
                            </div>
                        </div>

                        <div class="bg-white rounded-xl p-6 shadow-sm card-hover border-l-4 border-green-500">
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="text-sm text-gray-500 mb-1">任务完成</p>
                                    <h3 class="text-2xl font-bold text-gray-800" id="user-tasks-completed">0/0</h3>
                                    <p class="text-xs text-green-500 mt-1" id="user-task-rate">0%</p>
                                </div>
                                <div class="p-3 bg-green-100 rounded-lg">
                                    <i class="fas fa-check-circle text-green-600 text-xl"></i>
                                </div>
                            </div>
                        </div>

                        <div class="bg-white rounded-xl p-6 shadow-sm card-hover border-l-4 border-purple-500">
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="text-sm text-gray-500 mb-1">自动化贡献</p>
                                    <h3 class="text-2xl font-bold text-gray-800" id="user-auto-cases">0</h3>
                                    <p class="text-xs text-purple-500 mt-1">case自动化</p>
                                </div>
                                <div class="p-3 bg-purple-100 rounded-lg">
                                    <i class="fas fa-robot text-purple-600 text-xl"></i>
                                </div>
                            </div>
                        </div>

                        <div class="bg-white rounded-xl p-6 shadow-sm card-hover border-l-4 border-orange-500">
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="text-sm text-gray-500 mb-1">当前状态</p>
                                    <h3 class="text-2xl font-bold text-gray-800" id="user-status">空闲</h3>
                                    <p class="text-xs text-gray-500 mt-1" id="user-current-task">无进行任务</p>
                                </div>
                                <div class="p-3 bg-orange-100 rounded-lg">
                                    <i class="fas fa-user-circle text-orange-600 text-xl"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Overtime Trend Chart -->
                    <div class="bg-white rounded-xl shadow-sm p-6">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-lg font-bold text-gray-800">我的加班趋势</h3>
                            <div class="flex gap-2">
                                <button onclick="userApp.changePeriod('week')" class="px-3 py-1 text-sm rounded-lg bg-blue-100 text-blue-600 period-btn" data-period="week">本周</button>
                                <button onclick="userApp.changePeriod('month')" class="px-3 py-1 text-sm rounded-lg hover:bg-gray-100 period-btn" data-period="month">本月</button>
                                <button onclick="userApp.changePeriod('quarter')" class="px-3 py-1 text-sm rounded-lg hover:bg-gray-100 period-btn" data-period="quarter">本季度</button>
                            </div>
                        </div>
                        <div class="chart-container" style="height: 300px;">
                            <canvas id="personalOvertimeChart"></canvas>
                        </div>
                    </div>

                    <!-- Recent Activity -->
                    <div class="bg-white rounded-xl shadow-sm p-6">
                        <h3 class="text-lg font-bold text-gray-800 mb-4">最近动态</h3>
                        <div id="recent-activity" class="space-y-3">
                            <!-- Dynamic content -->
                        </div>
                    </div>
                </section>

                <!-- My Tasks Section -->
                <section id="section-tasks" class="space-y-6 hidden slide-in">
                    <div class="bg-white rounded-xl shadow-sm p-6">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-lg font-bold text-gray-800">我的任务</h3>
                            <div class="flex gap-2">
                                <select id="task-status-filter" class="px-3 py-2 border rounded-lg text-sm" onchange="userApp.filterTasks()">
                                    <option value="">全部状态</option>
                                    <option value="pending">待处理</option>
                                    <option value="progress">进行中</option>
                                    <option value="completed">已完成</option>
                                </select>
                            </div>
                        </div>
                        
                        <div id="task-list" class="space-y-4">
                            <!-- Dynamic task cards -->
                        </div>
                    </div>
                </section>

                <!-- Overtime Records Section -->
                <section id="section-overtime" class="space-y-6 hidden slide-in">
                    <!-- Add Overtime Form -->
                    <div class="bg-white rounded-xl shadow-sm p-6">
                        <h3 class="text-lg font-bold text-gray-800 mb-4">录入加班记录</h3>
                        <form id="overtime-form" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">日期</label>
                                <input type="date" id="ot-date" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">开始时间</label>
                                <input type="time" id="ot-start" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">结束时间</label>
                                <input type="time" id="ot-end" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">加班类型</label>
                                <select id="ot-type" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                                    <option value="weekday">工作日加班</option>
                                    <option value="weekend">周末加班</option>
                                    <option value="holiday">节假日加班</option>
                                </select>
                            </div>
                            <div class="md:col-span-3">
                                <label class="block text-sm font-medium text-gray-700 mb-1">工作内容</label>
                                <input type="text" id="ot-content" placeholder="请描述加班工作内容..." required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                            <div class="md:col-span-1 flex items-end">
                                <button type="submit" class="w-full px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                                    <i class="fas fa-plus mr-1"></i>提交记录
                                </button>
                            </div>
                        </form>
                    </div>

                    <!-- Overtime History -->
                    <div class="bg-white rounded-xl shadow-sm overflow-hidden">
                        <div class="px-6 py-4 border-b flex justify-between items-center">
                            <h3 class="text-lg font-bold text-gray-800">加班历史记录</h3>
                            <span class="text-sm text-gray-500" id="ot-total-count">共 0 条记录</span>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full">
                                <thead class="bg-gray-50">
                                    <tr>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">日期</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">时间段</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">时长</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">类型</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">工作内容</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">状态</th>
                                    </tr>
                                </thead>
                                <tbody id="overtime-table" class="divide-y divide-gray-200">
                                    <!-- Dynamic content -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>

                <!-- Profile Section -->
                <section id="section-profile" class="space-y-6 hidden slide-in">
                    <div class="bg-white rounded-xl shadow-sm p-6">
                        <h3 class="text-lg font-bold text-gray-800 mb-6">个人信息</h3>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">姓名</label>
                                <input type="text" id="profile-name" readonly class="w-full px-3 py-2 bg-gray-100 border rounded-lg text-gray-600">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">工号</label>
                                <input type="text" id="profile-no" readonly class="w-full px-3 py-2 bg-gray-100 border rounded-lg text-gray-600">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">部门</label>
                                <input type="text" id="profile-dept" readonly class="w-full px-3 py-2 bg-gray-100 border rounded-lg text-gray-600">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">职位</label>
                                <input type="text" id="profile-position" readonly class="w-full px-3 py-2 bg-gray-100 border rounded-lg text-gray-600">
                            </div>
                        </div>

                        <div class="mt-6 pt-6 border-t">
                            <h4 class="font-medium text-gray-800 mb-4">当前状态设置</h4>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">工作状态</label>
                                    <select id="profile-status" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" onchange="userApp.updateStatus()">
                                        <option value="idle">空闲</option>
                                        <option value="busy">忙碌</option>
                                        <option value="leave">请假</option>
                                        <option value="wfh">远程办公</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">当前任务</label>
                                    <input type="text" id="profile-current-task" placeholder="请输入当前进行中的任务..." class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" onblur="userApp.updateCurrentTask()">
                                </div>
                            </div>
                        </div>

                        <div class="mt-6 pt-6 border-t">
                            <h4 class="font-medium text-gray-800 mb-4">技能标签</h4>
                            <div id="skill-tags" class="flex flex-wrap gap-2 mb-3">
                                <!-- Dynamic skill tags -->
                            </div>
                            <div class="flex gap-2">
                                <input type="text" id="new-skill" placeholder="添加新技能..." class="flex-1 px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <button onclick="userApp.addSkill()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">添加</button>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Task Update Modal -->
    <div id="task-modal" class="modal fixed inset-0 bg-black bg-opacity-50 z-50 items-center justify-center hidden">
        <div class="bg-white rounded-xl w-full max-lg mx-4 max-w-md">
            <div class="px-6 py-4 border-b flex justify-between items-center">
                <h3 class="text-lg font-bold">更新任务进度</h3>
                <button onclick="userApp.closeTaskModal()" class="text-gray-400 hover:text-gray-600">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <form id="task-update-form" class="p-6 space-y-4">
                <input type="hidden" id="task-id">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">任务名称</label>
                    <input type="text" id="task-name-display" readonly class="w-full px-3 py-2 bg-gray-100 border rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">进度 (%)</label>
                    <input type="range" id="task-progress" min="0" max="100" class="w-full" oninput="document.getElementById('progress-value').textContent = this.value + '%'">
                    <div class="text-center text-sm text-gray-600 mt-1" id="progress-value">0%</div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">状态</label>
                    <select id="task-status" class="w-full px-3 py-2 border rounded-lg">
                        <option value="pending">待处理</option>
                        <option value="progress">进行中</option>
                        <option value="completed">已完成</option>
                        <option value="blocked">阻塞中</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">备注</label>
                    <textarea id="task-note" rows="3" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>
                <div class="flex gap-3 pt-4">
                    <button type="button" onclick="userApp.closeTaskModal()" class="flex-1 px-4 py-2 border rounded-lg hover:bg-gray-50">取消</button>
                    <button type="submit" class="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../shared/js/supabase.js"></script>
    <script src="../shared/js/utils.js"></script>
    <script src="../shared/components/sidebar.js"></script>
    <script src="../shared/components/header.js"></script>
    <script src="js/user.js"></script>
    <script>
        // Initialize user app when DOM loaded
        document.addEventListener('DOMContentLoaded', () => {
            window.userApp = new UserApp();
        });
    </script>
</body>
</html>
