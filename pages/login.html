<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Team Hub - 登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0a0f1c 0%, #1a1f3a 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(21, 27, 46, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    <div class="glass-card rounded-2xl p-8 w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-gradient-to-br from-blue-600 via-cyan-500 to-purple-600 rounded-xl flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-robot text-white text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-white">Auto Team Hub</h1>
            <p class="text-slate-400 mt-2">综合测试自动化中心</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm text-slate-400 mb-2">邮箱</label>
                <input type="email" id="email" required 
                    class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-blue-500"
                    placeholder="your.email@company.com">
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-2">密码</label>
                <input type="password" id="password" required 
                    class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-blue-500"
                    placeholder="••••••••">
            </div>
            <button type="submit" 
                class="w-full py-3 bg-blue-600 hover:bg-blue-500 rounded-lg text-white font-medium transition-all">
                登录
            </button>
        </form>

        <div id="errorMsg" class="mt-4 p-3 bg-red-500/20 border border-red-500/30 rounded-lg text-red-400 text-sm hidden"></div>
    </div>

    <script>
        const supabase = supabase.createClient(
            'https://your-project.supabase.co',
            'your-anon-key'
        );

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMsg');

            try {
                const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
                    email, password
                });

                if (authError) throw authError;

                // 获取用户角色
                const { data: profile } = await supabase
                    .from('user_profiles')
                    .select('role, personnel_id')
                    .eq('id', authData.user.id)
                    .single();

                // 根据角色跳转
                if (profile?.role === 'admin' || profile?.role === 'super_admin') {
                    window.location.href = '/admin/dashboard.html';
                } else {
                    window.location.href = '/user/dashboard.html';
                }

            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
