<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的仪表板 - Auto Team Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-slate-950 text-slate-200">
    <!-- 简化版侧边栏 -->
    <aside class="w-64 bg-slate-900 h-screen fixed left-0 top-0 border-r border-slate-800">
        <div class="p-6 border-b border-slate-800">
            <div class="flex items-center space-x-3">
                <i class="fas fa-robot text-blue-400 text-2xl"></i>
                <div>
                    <h1 class="font-bold text-white">Auto Team Hub</h1>
                    <p class="text-xs text-slate-500">用户中心</p>
                </div>
            </div>
        </div>
        
        <nav class="p-4 space-y-2">
            <a href="/user/dashboard.html" class="flex items-center px-4 py-3 bg-blue-600/20 text-blue-400 rounded-lg">
                <i class="fas fa-home w-6"></i>
                <span>我的仪表板</span>
            </a>
            <a href="/user/my-cases.html" class="flex items-center px-4 py-3 text-slate-400 hover:bg-slate-800 rounded-lg">
                <i class="fas fa-clipboard-check w-6"></i>
                <span>我的任务</span>
            </a>
            <a href="/user/equipment-view.html" class="flex items-center px-4 py-3 text-slate-400 hover:bg-slate-800 rounded-lg">
                <i class="fas fa-server w-6"></i>
                <span>设备状态</span>
            </a>
            <a href="/user/profile.html" class="flex items-center px-4 py-3 text-slate-400 hover:bg-slate-800 rounded-lg">
                <i class="fas fa-user w-6"></i>
                <span>个人信息</span>
            </a>
        </nav>

        <div class="absolute bottom-0 left-0 right-0 p-4 border-t border-slate-800">
            <button onclick="logout()" class="w-full px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-sm text-slate-300">
                <i class="fas fa-sign-out-alt mr-2"></i>退出登录
            </button>
        </div>
    </aside>

    <!-- 主内容 -->
    <main class="ml-64 p-8">
        <!-- 头部 -->
        <header class="flex justify-between items-center mb-8">
            <div>
                <h2 class="text-2xl font-bold text-white">欢迎回来，<span id="userName">加载中...</span></h2>
                <p class="text-slate-400 mt-1">今日加班: <span id="todayOvertime" class="text-orange-400 font-semibold">0h</span></p>
            </div>
            <div class="flex space-x-3">
                <button onclick="openOvertimeModal()" class="px-4 py-2 bg-orange-600 hover:bg-orange-500 rounded-lg text-white">
                    <i class="fas fa-clock mr-2"></i>记录加班
                </button>
            </div>
        </header>

        <!-- 快捷统计 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="glass-card rounded-xl p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-slate-400 text-sm">进行中任务</p>
                        <p class="text-3xl font-bold text-white" id="activeCases">0</p>
                    </div>
                    <div class="w-12 h-12 bg-blue-500/20 rounded-lg flex items-center justify-center">
                        <i class="fas fa-tasks text-blue-400 text-xl"></i>
                    </div>
                </div>
            </div>
            
            <div class="glass-card rounded-xl p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-slate-400 text-sm">本周加班</p>
                        <p class="text-3xl font-bold text-white" id="weekOvertime">0h</p>
                    </div>
                    <div class="w-12 h-12 bg-orange-500/20 rounded-lg flex items-center justify-center">
                        <i class="fas fa-clock text-orange-400 text-xl"></i>
                    </div>
                </div>
            </div>

            <div class="glass-card rounded-xl p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-slate-400 text-sm">已完成Case</p>
                        <p class="text-3xl font-bold text-white" id="completedCases">0</p>
                    </div>
                    <div class="w-12 h-12 bg-green-500/20 rounded-lg flex items-center justify-center">
                        <i class="fas fa-check-circle text-green-400 text-xl"></i>
                    </div>
                </div>
            </div>

            <div class="glass-card rounded-xl p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-slate-400 text-sm">当前状态</p>
                        <p class="text-lg font-bold text-green-400" id="currentStatus">在线</p>
                    </div>
                    <div class="w-12 h-12 bg-green-500/20 rounded-lg flex items-center justify-center">
                        <i class="fas fa-circle text-green-400 text-xl"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- 我的任务列表 -->
        <div class="glass-card rounded-xl p-6 mb-8">
            <h3 class="text-lg font-semibold text-white mb-4">我的任务</h3>
            <div id="myTasksList" class="space-y-3">
                <!-- 动态加载 -->
            </div>
        </div>

        <!-- 加班趋势图 -->
        <div class="glass-card rounded-xl p-6">
            <h3 class="text-lg font-semibold text-white mb-4">我的加班趋势</h3>
            <div class="h-64">
                <canvas id="myOvertimeChart"></canvas>
            </div>
        </div>
    </main>

    <!-- 加班录入弹窗 -->
    <div id="overtimeModal" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50">
        <div class="bg-slate-800 rounded-xl p-6 w-full max-w-md border border-slate-700">
            <h3 class="text-xl font-bold text-white mb-4">记录加班</h3>
            <form id="overtimeForm" class="space-y-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-1">日期</label>
                    <input type="date" id="otDate" required 
                        class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">时长 (小时)</label>
                    <input type="number" id="otHours" step="0.5" min="0.5" max="12" required 
                        class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">事由</label>
                    <textarea id="otReason" rows="2" 
                        class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white"></textarea>
                </div>
                <div class="flex justify-end space-x-3">
                    <button type="button" onclick="closeOvertimeModal()" 
                        class="px-4 py-2 text-slate-400 hover:text-white">取消</button>
                    <button type="submit" class="px-4 py-2 bg-orange-600 hover:bg-orange-500 rounded-lg text-white">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/user-app.js"></script>
    <script>
        // 用户端特定逻辑
        async function loadUserDashboard() {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) return window.location.href = '/login.html';

            // 获取个人信息
            const { data: profile } = await supabase
                .from('personnel')
                .select('*')
                .eq('user_id', user.id)
                .single();

            if (profile) {
                document.getElementById('userName').textContent = profile.name;
                document.getElementById('todayOvertime').textContent = profile.today_overtime + 'h';
                document.getElementById('currentStatus').textContent = profile.status === 'online' ? '在线' : '忙碌';
                document.getElementById('currentStatus').className = 
                    'text-lg font-bold ' + (profile.status === 'online' ? 'text-green-400' : 'text-yellow-400');
            }

            // 获取我的任务
            const { data: cases } = await supabase
                .from('cases')
                .select('*')
                .eq('assignee_id', profile.id)
                .in('status', ['todo', 'progress']);

            document.getElementById('activeCases').textContent = cases?.length || 0;
            
            const tasksHtml = cases?.map(c => `
                <div class="flex items-center justify-between p-4 bg-slate-800/50 rounded-lg border-l-4 ${
                    c.priority === 'high' ? 'border-red-500' : 
                    c.priority === 'medium' ? 'border-yellow-500' : 'border-blue-500'
                }">
                    <div>
                        <h4 class="text-white font-medium">${c.title}</h4>
                        <p class="text-sm text-slate-400">${c.id} | 进度: ${c.progress}%</p>
                    </div>
                    <div class="flex items-center space-x-3">
                        <div class="w-32 h-2 bg-slate-700 rounded-full overflow-hidden">
                            <div class="h-full bg-blue-500 rounded-full" style="width: ${c.progress}%"></div>
                        </div>
                        <button onclick="updateProgress('${c.id}')" class="text-blue-400 hover:text-blue-300 text-sm">
                            更新进度
                        </button>
                    </div>
                </div>
            `).join('') || '<p class="text-slate-500 text-center py-4">暂无进行中的任务</p>';
            
            document.getElementById('myTasksList').innerHTML = tasksHtml;

            // 获取本周加班统计
            const { data: overtime } = await supabase
                .from('overtime_records')
                .select('hours, date')
                .eq('user_id', profile.id)
                .gte('date', new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString());

            const weekTotal = overtime?.reduce((a, b) => a + b.hours, 0) || 0;
            document.getElementById('weekOvertime').textContent = weekTotal.toFixed(1) + 'h';

            // 渲染加班趋势图
            renderOvertimeChart(overtime || []);
        }

        function renderOvertimeChart(data) {
            const ctx = document.getElementById('myOvertimeChart').getContext('2d');
            const dates = data.map(d => new Date(d.date).toLocaleDateString('zh-CN', { weekday: 'short' }));
            const hours = data.map(d => d.hours);

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: dates,
                    datasets: [{
                        label: '加班时长',
                        data: hours,
                        borderColor: '#f97316',
                        backgroundColor: 'rgba(249, 115, 22, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { grid: { color: 'rgba(255,255,255,0.1)' }, ticks: { color: '#94a3b8' } },
                        x: { ticks: { color: '#94a3b8' } }
                    }
                }
            });
        }

        function openOvertimeModal() {
            document.getElementById('overtimeModal').classList.remove('hidden');
            document.getElementById('overtimeModal').classList.add('flex');
            document.getElementById('otDate').valueAsDate = new Date();
        }

        function closeOvertimeModal() {
            document.getElementById('overtimeModal').classList.add('hidden');
            document.getElementById('overtimeModal').classList.remove('flex');
        }

        document.getElementById('overtimeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const { data: { user } } = await supabase.auth.getUser();
            const { data: profile } = await supabase.from('personnel').select('id').eq('user_id', user.id).single();

            const { error } = await supabase.from('overtime_records').insert([{
                user_id: profile.id,
                date: document.getElementById('otDate').value,
                hours: parseFloat(document.getElementById('otHours').value),
                reason: document.getElementById('otReason').value,
                created_by: profile.id
            }]);

            if (!error) {
                closeOvertimeModal();
                loadUserDashboard(); // 刷新
            }
        });

        async function logout() {
            await supabase.auth.signOut();
            window.location.href = '/login.html';
        }

        // 初始化
        loadUserDashboard();
    </script>
</body>
</html>
