<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Team Hub - 加班监控</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="../shared/css/main.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<base target="_blank">
</head>
<body class="bg-gray-50 text-gray-800">
    <div class="flex h-screen overflow-hidden">
        <aside id="sidebar" class="w-64 gradient-bg text-white flex flex-col shadow-2xl"></aside>

        <main class="flex-1 overflow-auto">
            <header id="header" class="glass-effect sticky top-0 z-40 px-8 py-4 shadow-sm flex justify-between items-center">
                <h2 class="text-2xl font-bold text-gray-800">加班监控</h2>
                <div class="flex items-center gap-4">
                    <button onclick="adminApp.refreshData()" class="p-2 rounded-lg hover:bg-gray-100">
                        <i class="fas fa-sync-alt text-gray-600"></i>
                    </button>
                    <div class="flex items-center gap-3 pl-4 border-l">
                        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-purple-400 to-purple-600 text-white flex items-center justify-center text-sm font-bold">A</div>
                        <span class="text-sm font-medium">管理员</span>
                    </div>
                </div>
            </header>

            <div class="p-8 space-y-6">
                <!-- Department Overtime Statistics -->
                <div class="bg-white rounded-xl shadow-sm p-6">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-lg font-bold text-gray-800">部门加班统计</h3>
                        <div class="flex gap-2">
                            <select id="ot-period" class="px-3 py-1 border rounded-lg text-sm" onchange="adminApp.loadOvertimeData()">
                                <option value="month">本月</option>
                                <option value="quarter">本季度</option>
                                <option value="year">本年度</option>
                            </select>
                            <button onclick="adminApp.exportOvertimeReport()" class="px-3 py-1 bg-blue-600 text-white rounded-lg text-sm">
                                <i class="fas fa-download mr-1"></i>导出报表
                            </button>
                        </div>
                    </div>
                    <div class="chart-container" style="height: 400px;">
                        <canvas id="overtimeChart"></canvas>
                    </div>
                </div>

                <!-- Alert List -->
                <div class="bg-white rounded-xl shadow-sm p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-bold text-gray-800">
                            <i class="fas fa-exclamation-triangle text-red-500 mr-2"></i>加班预警名单
                        </h3>
                        <span class="text-sm text-gray-500" id="warning-count" data-stat="warning_count">0 人超标</span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">工号</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">姓名</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">部门</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">本月加班</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">连续加班天数</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">预警级别</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">操作</th>
                                </tr>
                            </thead>
                            <tbody id="warning-table" class="divide-y divide-gray-200">
                                <!-- Dynamic content -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Efficiency Matrix -->
                <div class="bg-white rounded-xl shadow-sm p-6">
                    <h3 class="text-lg font-bold text-gray-800 mb-4">人效分析矩阵</h3>
                    <div class="chart-container" style="height: 400px;">
                        <canvas id="efficiencyChart"></canvas>
                    </div>
                </div>

                <!-- Overtime Records -->
                <div class="bg-white rounded-xl shadow-sm overflow-hidden">
                    <div class="px-6 py-4 border-b flex justify-between items-center">
                        <h3 class="text-lg font-bold text-gray-800">加班记录明细</h3>
                        <div class="flex gap-2">
                            <input type="date" id="ot-date-from" class="px-3 py-1 border rounded-lg text-sm">
                            <span class="text-gray-500">至</span>
                            <input type="date" id="ot-date-to" class="px-3 py-1 border rounded-lg text-sm">
                            <button onclick="adminApp.filterOvertimeRecords()" class="px-3 py-1 bg-blue-600 text-white rounded-lg text-sm">查询</button>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">日期</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">姓名</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">部门</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">时间段</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">时长</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">工作内容</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">状态</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">操作</th>
                                </tr>
                            </thead>
                            <tbody id="overtime-records-table" class="divide-y divide-gray-200">
                                <!-- Dynamic content -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../shared/js/supabase.js"></script>
    <script src="../shared/js/utils.js"></script>
    <script src="../shared/components/sidebar.js"></script>
    <script src="js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            window.adminApp = new AdminApp('overtime');
        });
    </script>
</body>
</html>
