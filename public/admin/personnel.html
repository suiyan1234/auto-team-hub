<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Team Hub - 人员管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="../shared/css/main.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<base target="_blank">
</head>
<body class="bg-gray-50 text-gray-800">
    <div class="flex h-screen overflow-hidden">
        <aside id="sidebar" class="w-64 gradient-bg text-white flex flex-col shadow-2xl"></aside>

        <main class="flex-1 overflow-auto">
            <header id="header" class="glass-effect sticky top-0 z-40 px-8 py-4 shadow-sm flex justify-between items-center">
                <h2 class="text-2xl font-bold text-gray-800">人员管理</h2>
                <div class="flex items-center gap-4">
                    <button onclick="adminApp.refreshData()" class="p-2 rounded-lg hover:bg-gray-100">
                        <i class="fas fa-sync-alt text-gray-600"></i>
                    </button>
                    <div class="flex items-center gap-3 pl-4 border-l">
                        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-purple-400 to-purple-600 text-white flex items-center justify-center text-sm font-bold">A</div>
                        <span class="text-sm font-medium">管理员</span>
                    </div>
                </div>
            </header>

            <div class="p-8 space-y-6">
                <!-- Department Overtime Trend Chart (Top) -->
                <div class="bg-white rounded-xl shadow-sm p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-bold text-gray-800">部门加班趋势</h3>
                        <div class="flex gap-2">
                            <select id="trend-period" class="px-3 py-1 border rounded-lg text-sm" onchange="adminApp.loadPersonnelData()">
                                <option value="month">本月</option>
                                <option value="quarter">本季度</option>
                                <option value="year">本年度</option>
                            </select>
                            <button onclick="adminApp.exportDeptTrend()" class="px-3 py-1 bg-blue-600 text-white rounded-lg text-sm">
                                <i class="fas fa-download mr-1"></i>导出
                            </button>
                        </div>
                    </div>
                    <div class="chart-container" style="height: 350px;">
                        <canvas id="deptTrendChart"></canvas>
                    </div>
                </div>

                <!-- Action Bar -->
                <div class="flex justify-between items-center">
                    <div class="flex gap-4">
                        <div class="relative">
                            <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                            <input type="text" id="personnel-search" placeholder="搜索姓名、工号、部门..." 
                                class="pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 w-80"
                                oninput="adminApp.filterPersonnel()">
                        </div>
                        <select id="dept-filter" class="px-4 py-2 border rounded-lg" onchange="adminApp.filterPersonnel()">
                            <option value="">全部部门</option>
                            <option value="研发部">研发部</option>
                            <option value="测试部">测试部</option>
                            <option value="产品部">产品部</option>
                            <option value="运维部">运维部</option>
                        </select>
                        <select id="status-filter" class="px-4 py-2 border rounded-lg" onchange="adminApp.filterPersonnel()">
                            <option value="">全部状态</option>
                            <option value="active">在职</option>
                            <option value="inactive">离职</option>
                        </select>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="adminApp.openBatchImportModal()" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 flex items-center gap-2">
                            <i class="fas fa-file-excel"></i> 批量导入
                        </button>
                        <button onclick="adminApp.openPersonnelModal()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 flex items-center gap-2">
                            <i class="fas fa-plus"></i> 新增人员
                        </button>
                    </div>
                </div>

                <!-- Personnel Cards Grid -->
                <div id="personnel-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                    <!-- Dynamic personnel cards -->
                </div>

                <!-- Personnel Table -->
                <div class="bg-white rounded-xl shadow-sm overflow-hidden">
                    <div class="px-6 py-4 border-b">
                        <h3 class="text-lg font-bold text-gray-800">人员列表</h3>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">工号</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">姓名</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">部门</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">职位</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">技能</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">本月加班</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">状态</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">操作</th>
                                </tr>
                            </thead>
                            <tbody id="personnel-table" class="divide-y divide-gray-200">
                                <!-- Dynamic content -->
                            </tbody>
                        </table>
                    </div>
                    <div class="px-6 py-3 border-t flex justify-between items-center">
                        <span class="text-sm text-gray-500" id="personnel-count" data-stat="personnel_count">共 0 人</span>
                        <div class="flex gap-1" id="pagination">
                            <!-- Dynamic pagination -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Personnel Modal -->
    <div id="personnel-modal" class="modal fixed inset-0 bg-black bg-opacity-50 z-50 items-center justify-center hidden">
        <div class="bg-white rounded-xl w-full max-w-lg mx-4 max-h-[90vh] overflow-y-auto">
            <div class="px-6 py-4 border-b flex justify-between items-center">
                <h3 class="text-lg font-bold" id="personnel-modal-title">新增人员</h3>
                <button onclick="adminApp.closePersonnelModal()" class="text-gray-400 hover:text-gray-600">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <form id="personnel-form" class="p-6 space-y-4">
                <input type="hidden" id="personnel-id">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">工号 *</label>
                        <input type="text" id="p-no" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">姓名 *</label>
                        <input type="text" id="p-name" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">部门 *</label>
                        <select id="p-dept" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="研发部">研发部</option>
                            <option value="测试部">测试部</option>
                            <option value="产品部">产品部</option>
                            <option value="运维部">运维部</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">职位 *</label>
                        <input type="text" id="p-position" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">邮箱 *</label>
                    <input type="email" id="p-email" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">技能标签（逗号分隔）</label>
                    <input type="text" id="p-skills" placeholder="Python, 自动化测试, Selenium" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">角色</label>
                    <select id="p-role" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="user">普通用户</option>
                        <option value="admin">管理员</option>
                    </select>
                </div>
                <div class="flex gap-3 pt-4">
                    <button type="button" onclick="adminApp.closePersonnelModal()" class="flex-1 px-4 py-2 border rounded-lg hover:bg-gray-50">取消</button>
                    <button type="submit" class="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Batch Import Modal -->
    <div id="batch-import-modal" class="modal fixed inset-0 bg-black bg-opacity-50 z-50 items-center justify-center hidden">
        <div class="bg-white rounded-xl w-full max-w-2xl mx-4">
            <div class="px-6 py-4 border-b flex justify-between items-center">
                <h3 class="text-lg font-bold">批量导入人员</h3>
                <button onclick="adminApp.closeBatchImportModal()" class="text-gray-400 hover:text-gray-600">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div class="p-6">
                <div id="drop-zone" class="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center hover:border-blue-500 transition-colors cursor-pointer">
                    <i class="fas fa-cloud-upload-alt text-4xl text-gray-400 mb-3"></i>
                    <p class="text-gray-600 mb-2">拖拽CSV/JSON/Excel文件到此处，或点击上传</p>
                    <input type="file" id="import-file" accept=".csv,.json,.xlsx,.xls" class="hidden" onchange="adminApp.handleImportFile(event)">
                    <button onclick="document.getElementById('import-file').click()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                        选择文件
                    </button>
                    <p class="text-xs text-gray-400 mt-2">支持 CSV, JSON, Excel 格式</p>
                </div>
                
                <div class="mt-4 flex justify-between items-center">
                    <a href="#" onclick="adminApp.downloadTemplate()" class="text-blue-600 text-sm hover:underline">
                        <i class="fas fa-download"></i> 下载导入模板
                    </a>
                    <span class="text-xs text-gray-400">请按照模板格式填写数据</span>
                </div>

                <div id="import-preview" class="hidden mt-4">
                    <h4 class="font-medium mb-2">数据预览（前5条）</h4>
                    <div class="max-h-48 overflow-auto border rounded-lg">
                        <table class="w-full text-sm">
                            <thead class="bg-gray-50" id="import-preview-header"></thead>
                            <tbody id="import-preview-body"></tbody>
                        </table>
                    </div>
                    <div class="flex gap-2 mt-4 justify-end">
                        <button onclick="adminApp.closeBatchImportModal()" class="px-4 py-2 border rounded-lg">取消</button>
                        <button onclick="adminApp.confirmBatchImport()" class="px-4 py-2 bg-green-600 text-white rounded-lg">确认导入</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../shared/js/supabase.js"></script>
    <script src="../shared/js/utils.js"></script>
    <script src="../shared/components/sidebar.js"></script>
    <script src="js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            window.adminApp = new AdminApp('personnel');
        });
    </script>
</body>
</html>
