<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Team Hub - 管理仪表板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="../shared/css/main.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside id="sidebar" class="w-64 gradient-bg text-white flex flex-col shadow-2xl">
            <!-- Injected by sidebar.js -->
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-auto">
            <!-- Header -->
            <header id="header" class="glass-effect sticky top-0 z-40 px-8 py-4 shadow-sm flex justify-between items-center">
                <h2 class="text-2xl font-bold text-gray-800">管理仪表板</h2>
                <div class="flex items-center gap-4">
                    <span class="text-sm text-gray-500" id="current-time"></span>
                    <button onclick="adminApp.refreshData()" class="p-2 rounded-lg hover:bg-gray-100" title="刷新数据">
                        <i class="fas fa-sync-alt text-gray-600"></i>
                    </button>
                    <button class="p-2 rounded-lg hover:bg-gray-100 relative">
                        <i class="fas fa-bell text-gray-600"></i>
                        <span id="notification-badge" class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full hidden"></span>
                    </button>
                    <div class="flex items-center gap-3 pl-4 border-l">
                        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-purple-400 to-purple-600 text-white flex items-center justify-center text-sm font-bold">
                            A
                        </div>
                        <span class="text-sm font-medium">管理员</span>
                    </div>
                </div>
            </header>

            <div class="p-8 space-y-6">
                <!-- KPI Cards -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                    <div class="bg-white rounded-xl p-6 shadow-sm card-hover border-l-4 border-blue-500">
                        <div class="flex justify-between items-start">
                            <div>
                                <p class="text-sm text-gray-500 mb-1">总员工数</p>
                                <h3 class="text-3xl font-bold text-gray-800" id="total-employees">0</h3>
                                <p class="text-xs text-green-500 mt-1"><i class="fas fa-arrow-up"></i> 较上月</p>
                            </div>
                            <div class="p-3 bg-blue-100 rounded-lg">
                                <i class="fas fa-users text-blue-600 text-xl"></i>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-xl p-6 shadow-sm card-hover border-l-4 border-green-500">
                        <div class="flex justify-between items-start">
                            <div>
                                <p class="text-sm text-gray-500 mb-1">本月总加班</p>
                                <h3 class="text-3xl font-bold text-gray-800" id="total-overtime">0h</h3>
                                <p class="text-xs text-orange-500 mt-1" id="ot-trend">统计中...</p>
                            </div>
                            <div class="p-3 bg-green-100 rounded-lg">
                                <i class="fas fa-clock text-green-600 text-xl"></i>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-xl p-6 shadow-sm card-hover border-l-4 border-purple-500">
                        <div class="flex justify-between items-start">
                            <div>
                                <p class="text-sm text-gray-500 mb-1">任务完成率</p>
                                <h3 class="text-3xl font-bold text-gray-800" id="task-completion">0%</h3>
                                <p class="text-xs text-gray-500 mt-1">本月目标: 85%</p>
                            </div>
                            <div class="p-3 bg-purple-100 rounded-lg">
                                <i class="fas fa-tasks text-purple-600 text-xl"></i>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-xl p-6 shadow-sm card-hover border-l-4 border-orange-500">
                        <div class="flex justify-between items-start">
                            <div>
                                <p class="text-sm text-gray-500 mb-1">设备稼动率</p>
                                <h3 class="text-3xl font-bold text-gray-800" id="equipment-utilization">0%</h3>
                                <p class="text-xs text-green-500 mt-1">运行良好</p>
                            </div>
                            <div class="p-3 bg-orange-100 rounded-lg">
                                <i class="fas fa-server text-orange-600 text-xl"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Charts Row -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <!-- Department Overtime Overview -->
                    <div class="bg-white rounded-xl shadow-sm p-6">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-lg font-bold text-gray-800">部门加班概览</h3>
                            <a href="overtime.html" class="text-blue-600 text-sm hover:underline">查看详情</a>
                        </div>
                        <div class="chart-container" style="height: 300px;">
                            <canvas id="deptOvertimeChart"></canvas>
                        </div>
                    </div>

                    <!-- Task Status Distribution -->
                    <div class="bg-white rounded-xl shadow-sm p-6">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-lg font-bold text-gray-800">任务状态分布</h3>
                            <a href="cases.html" class="text-blue-600 text-sm hover:underline">查看详情</a>
                        </div>
                        <div class="chart-container" style="height: 300px;">
                            <canvas id="taskStatusChart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- Alert Center -->
                <div class="bg-white rounded-xl shadow-sm p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-bold text-gray-800">
                            <i class="fas fa-exclamation-triangle text-orange-500 mr-2"></i>预警中心
                        </h3>
                        <span class="text-sm text-gray-500" id="alert-count">0 个预警</span>
                    </div>
                    <div id="alert-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        <!-- Dynamic alerts -->
                    </div>
                </div>

                <!-- Real-time Status -->
                <div class="bg-white rounded-xl shadow-sm p-6">
                    <h3 class="text-lg font-bold text-gray-800 mb-4">实时状态监控</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="bg-gray-50 rounded-lg p-4">
                            <h4 class="font-medium text-gray-700 mb-3">在线人员</h4>
                            <div id="online-users" class="flex -space-x-2 overflow-hidden">
                                <!-- Dynamic avatars -->
                            </div>
                            <p class="text-sm text-gray-500 mt-2" id="online-count">0 人在线</p>
                        </div>
                        
                        <div class="bg-gray-50 rounded-lg p-4">
                            <h4 class="font-medium text-gray-700 mb-3">设备运行状态</h4>
                            <div class="space-y-2" id="equipment-status">
                                <!-- Dynamic equipment status -->
                            </div>
                        </div>
                        
                        <div class="bg-gray-50 rounded-lg p-4">
                            <h4 class="font-medium text-gray-700 mb-3">待审批事项</h4>
                            <ul class="space-y-2 text-sm" id="pending-approvals">
                                <!-- Dynamic pending items -->
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../shared/js/supabase.js"></script>
    <script src="../shared/js/utils.js"></script>
    <script src="../shared/components/sidebar.js"></script>
    <script src="js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            window.adminApp = new AdminApp('dashboard');
        });
    </script>
</body>
</html>
